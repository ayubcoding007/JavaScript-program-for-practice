<!-- JavaScript Syntax
JavaScript syntax comprises a set of rules that define how to construct a JavaScript code. 
JavaScript can be implemented using JavaScript statements that are placed within 
the <script>... </script> HTML tags in a web page.

You can place the <script> tags, containing your JavaScript, anywhere within 
your web page, but it is normally recommended that you should keep it within the <head> tags.

The <script> tag alerts the browser program to start interpreting all the text between 
these tags as a script. A simple syntax of your JavaScript will appear as follows. -->


<html>

<head>
   <title> My first JavaScript program </title>
<head>
   <body>
      <h1>hello world</h1>

      <script language="javascript" type="text/javascript">
         let firstProgram = "hello Ayub"
         console.log(firstProgram)
      </script>
   </body>
</html>
